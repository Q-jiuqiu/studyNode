<!DOCTYPE html>
<html>

<head>
  <title>柱状图</title>
  <link rel="stylesheet" href="./data/ol.css" type="text/css" />
  <script src="./data/ol-debug.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/openlayers/dist/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/openlayers/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol3-echarts/dist/ol3Echarts.js"></script>

</head>

<body>
  <div id="map" class="map"></div>
  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([0, 0]),
        zoom: 2
      })
    });

    var options = {
      grid: [],
      xAxis: [],
      yAxis: [],
      series: []
    }
    const data = [
      { coor: [87.1435546875, 43.79150390625], value: 50 },
      { coor: [86.5283203125, 32.40966796875], value: 60 },
      { coor: [98.876953125, 35.74951171875], value: 20 },
      { coor: [108.80859375, 23.44482421875], value: 90 },
      { coor: [104.0665, 30.5728], value: 88 },
      { coor: [110.53450137499999, 38.44104525], value: 80 },
    ]

    data.forEach((item, index) => {
      const series = []
      const index2 = 2 * index
      // 背景柱状图设置
      series.push({
        // 辅助系列
        type: 'bar',
        silent: true,
        coordinates: item.coor,
        itemStyle: {
          normal: {
            barBorderRadius: 20,
            color: '#d5eafb',
            borderColor: '#50a3ef',
            borderWidth: 1,
          }
        },
        label: {
          normal: {
            show: true,
            position: 'top',
            formatter: (e) => {
              return `已用：${item.value}%`
            },
            fontSize: 10,
            color: '#fff',
            backgroundColor: "#3781ca",
            borderRadius: 20,
            lineHeight: 20,
            padding: [0, 8]
          }
        },
        barWidth: '19',
        data: [100],
        xAxisIndex: index2,
        yAxisIndex: index2
      })
      // 已用数据设置
      series.push({
        name: '已用',
        type: 'bar',
        barWidth: '15',
        coordinates: item.coor,
        data: [item.value],
        xAxisIndex: index2 + 1,
        yAxisIndex: index2 + 1,
        itemStyle: {
          normal: {
            barBorderRadius: 20,
            color: '#50a3ef',
          }
        }
      })
      // 需要为背景柱状图和数据柱状图分别设置grid、xAxis、yAxis参数
      options.grid.push({
        borderWidth: 0,
        // echart 大小设置
        width: 80,
        height: 80
      });
      options.grid.push({
        borderWidth: 0,
        // echart 大小设置
        width: 80,
        height: 80
      });
      options.xAxis.push({
        type: 'category',
        show: true,
        gridIndex: index2,
        axisLine: {
          show: false,
          onZero: false
        },
        axisLabel: {
          show: false,
        },
        axisTick: {
          show: false
        },
        data: ['已使用']
      });
      options.xAxis.push({
        type: 'category',
        show: true,
        gridIndex: index2 + 1,
        axisLine: {
          show: false,
          onZero: false
        },
        axisLabel: {
          show: false,
        },
        axisTick: {
          show: false
        },
        data: ['已使用']
      });
      options.yAxis.push({
        type: 'value',
        show: true,
        max: 100,
        min: 1,
        splitLine: { show: false },
        axisLabel: {
          show: false
        },
        axisLine: {
          show: false,
          onZero: false
        },
        nameGap: '1',
        axisTick: {
          show: false
        },
        gridIndex: index2
      });
      options.yAxis.push({
        type: 'value',
        show: true,
        max: 100,
        min: 1,
        splitLine: { show: false },
        axisLabel: {
          show: false
        },
        axisLine: {
          show: false,
          onZero: false
        },
        nameGap: '1',
        axisTick: {
          show: false
        },
        gridIndex: index2 + 1
      });
      options.series.push(...series)
    })

    console.log("options", options);

    var echartslayer = new ol3Echarts(options);
    echartslayer.appendTo(map)
  </script>
</body>

</html>
